  <title id="title">같은 얼굴 윤곽에서 비교하는 이목구비 배치</title>
  <desc id="desc">윤곽이 같은 두 성인 남성의 얼굴. 왼쪽은 이목구비가 안쪽에 모인 배치, 오른쪽은 넓게 펼쳐진 배치의 설명용 예시다. 실제 인물이나 측정 결과가 아니며 좋고 나쁨을 나타내지 않는다.</desc>
