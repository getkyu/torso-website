  <title id="title">정면에서 살펴보는 눈썹과 얼굴의 여백</title>
  <desc id="desc">성인 남성의 정면 얼굴을 그린 설명용 일러스트. 1은 눈썹의 농도와 길이와 높이, 2는 눈과 눈썹 사이 거리, 3은 눈끝에서 헤어라인까지의 여백을 가리킨다. 실제 인물이나 측정 결과가 아니다.</desc>
